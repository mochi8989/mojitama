<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>もじたま！ことば一覧</title><style>body{font-family:system-ui,sans-serif;max-width:1000px;margin:auto;padding:20px;color:#34425b;background:#f7f4ff}h1{color:#574d9d}label{display:inline-grid;gap:4px;margin:6px}input,select{font:inherit;padding:8px;border:2px solid #d8d1fa;border-radius:8px}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:8px;border-bottom:1px solid #ddd}th{position:sticky;top:0;background:#eeeaff}.count{font-weight:bold;margin:12px 0}</style><h1>📖 もじたま！ことば一覧</h1><p>ゲームに入っていることばを検索できます。見るだけのページです。</p><label>ことばを検索<input id="query" type="search" placeholder="日本語・読み・ローマじ"></label><label>カテゴリ<select id="category"><option value="">すべて</option></select></label><label>難易度<select id="difficulty"><option value="">すべて</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>種類<select id="kind"><option value="">すべて</option><option value="normal">ふつう</option><option value="fun">おもしろ</option></select></label><label><input id="meme" type="checkbox">流行語・ミーム</label><div class="count" id="count" aria-live="polite"></div><div style="overflow:auto;max-height:70vh"><table><thead><tr><th>日本語</th><th>読み</th><th>ローマじ</th><th>カテゴリ</th><th>難易度</th><th>種類</th></tr></thead><tbody id="rows"></tbody></table></div><script src="./words.js"></script></html>
